schema_version: 1
repository:
  name: dosev-ai/chatgpt-skills
  default_branch: main
  contribution_model: pull-request-only
  canonical_repository: deldos/skills
  required_checks:
    - Public Skill Validation
    - Bot Comment Closure Rate

naming:
  skill_id_pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  directory_pattern: 'skills/<skill-id>'

versioning:
  scheme: semver

license_status: approved

allowed_release_states:
  - not-candidate
  - candidate-needs-sanitization
  - ready-for-public-pr
  - public-pr-open
  - public-merged-verification-pending
  - public-released

skills:
  - id: governed-prd-creation
    path: skills/governed-prd-creation
    display_name: Governed PRD Creation
    version: 1.1.1
    release_state: public-pr-open
    description: Create, review, repair, version, approve, and hand off measurable Product Requirements Documents before architecture or implementation planning.
    canonical:
      repository: deldos/skills
      path: skills/governed-prd-creation
      version: 1.1.1
      source_pr: 33
      final_pr_head: eab6db6554841182fe763fc7781a8e8db90feaa2
      merge_commit: f218d5ffaddcab12a736420166f3348b31183dac
    license: MIT
    artifact_status: package
    public_pr: 5
    verification: "REPAIR PRE-MERGE PASS: skill.zip now uses the standard skill-creator layout with one top-level governed-prd-creation directory; all 13 source files match byte-for-byte after prefix removal; source and extracted archive validation pass; 9 package-layout and evidence regression tests pass. ChatGPT upload/replacement and merged-tree verification remain pending."
    residuals:
      - Confirm ChatGPT upload or replacement of the repaired package and record the exact runtime result.
      - Verify the package from the repair merge before returning the skill to public-released.
  - id: governed-excel-creation
    path: skills/governed-excel-creation
    display_name: Governed Excel Creation
    version: 1.1.0
    release_state: ready-for-public-pr
    description: Create, extend, repair, reformat, and validate portable, self-describing Excel workbooks with bounded changes, metadata, validation, and optional connected-source extensions.
    canonical:
      repository: deldos/skills
      path: skills/governed-excel-creation
      version: 1.1.0
      source_pr: 57
      final_pr_head: 6380edaf538bc4ec4d7de2666c90f0eff1ab759c
      merge_commit: 1b98d30f0edd564df165a73b4772505cf94258c1
    license: MIT
    artifact_status: none
    verification: "PRE-PR SOURCE PASS: the 40-file public-safe projection validates with skill-creator, passes public-safety scanning and Python compilation, and passes representative connector-free workbook metadata/context/workflow preflight. Public exact-head review, required repository checks, merge, merged-tree verification, and the separate installable ZIP publication gate remain pending."
    residuals:
      - Open and review the exact public pull-request HEAD; require Public Skill Validation and Bot Comment Closure Rate to pass before merge.
      - Verify the merged public source tree before classifying the source projection as released.
      - Publish the already-built installable skill.zip through the separate binary packaging gate; do not claim the ZIP is public until its checksum and merged artifact are verified.
