schema_version: 1
repository:
  name: dosev-ai/chatgpt-skills
  default_branch: main
  contribution_model: pull-request-only
  canonical_repository: deldos/skills
  required_checks:
    - Public Skill Validation
    - Bot Comment Closure Rate

naming:
  skill_id_pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  directory_pattern: 'skills/<skill-id>'

versioning:
  scheme: semver

license_status: approved

allowed_release_states:
  - not-candidate
  - candidate-needs-sanitization
  - ready-for-public-pr
  - public-pr-open
  - public-merged-verification-pending
  - public-released

skills:
  - id: governed-prd-creation
    path: skills/governed-prd-creation
    display_name: Governed PRD Creation
    version: 1.2.0
    release_state: public-pr-open
    description: Create, review, repair, version, approve, and hand off measurable Product Requirements Documents before architecture or implementation planning.
    canonical:
      repository: deldos/skills
      path: skills/governed-prd-creation
      version: 1.2.0
      source_pr: 51
      final_pr_head: a8e3333b9efcdab6621d74312d081c6e1125e8cf
      merge_commit: 1d734545511227fef25ba131d3fd6e705c248d20
    license: MIT
    artifact_status: none
    public_pr: 7
    verification: "PUBLIC PR #7 OPEN: canonical v1.2.0 preflight compatibility is projected without the private specialist dependency; stale v1.1.1 package removed. Exact-final-HEAD validation/review, merge, merged-tree verification, clean-room invocation, and a new v1.2.0 package remain pending."
    residuals:
      - Require Public Skill Validation, accepted exact-final-HEAD automated review, and Bot Comment Closure Rate PASS on public PR #7 before merge.
      - Verify the merged public source tree and run clean-room invocation before release classification.
      - Build and publish a v1.2.0 skill.zip only from the merged verified public release, then record SHA-256 evidence.
  - id: governed-excel-creation
    path: skills/governed-excel-creation
    display_name: Governed Excel Creation
    version: 1.1.1
    release_state: public-pr-open
    description: Create, extend, repair, reformat, and validate portable, self-describing Excel workbooks with bounded changes, metadata, validation, and optional connected-source extensions.
    canonical:
      repository: deldos/skills
      path: skills/governed-excel-creation
      version: 1.1.1
      source_pr: 58
      final_pr_head: fe121804374939f6d07694f67fdc4d90b920c294
      merge_commit: 4e3c6a3e96712c6476dd9675cdd22264f3d1c049
    license: MIT
    artifact_status: none
    public_pr: 6
    verification: "PUBLIC PR REPAIR: v1.1.1 re-projects canonical PR 58 merge 4e3c6a3e96712c6476dd9675cdd22264f3d1c049, rejects cross-workflow run-step lineage, validates populated blank-ID rows, and preserves fail-closed macro-aware legacy .xls conversion. Exact-final-HEAD public validation/review, merge, merged-tree verification, and a new v1.1.1 installable ZIP publication gate remain pending."
    residuals:
      - Require Public Skill Validation, accepted exact-final-HEAD automated review, and Bot Comment Closure Rate PASS on the repaired v1.1.1 public PR before merge.
      - Verify the merged public source tree before advancing beyond public-merged-verification-pending.
      - Build and publish a new v1.1.1 installable skill.zip through the separate binary packaging gate; the prior v1.1.0 local package is superseded and must not be published as current.
