schema_version: 1
repository:
  name: dosev-ai/chatgpt-skills
  default_branch: main
  contribution_model: pull-request-only
  canonical_repository: deldos/skills
  required_checks:
    - Public Skill Validation
    - Bot Comment Closure Rate

naming:
  skill_id_pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  directory_pattern: 'skills/<skill-id>'

versioning:
  scheme: semver

license_status: approved

allowed_release_states:
  - not-candidate
  - candidate-needs-sanitization
  - ready-for-public-pr
  - public-pr-open
  - public-merged-verification-pending
  - public-released

skills:
  - id: governed-prd-creation
    path: skills/governed-prd-creation
    display_name: Governed PRD Creation
    version: 1.1.1
    release_state: public-released
    description: Create, review, repair, version, approve, and hand off measurable Product Requirements Documents before architecture or implementation planning.
    canonical:
      repository: deldos/skills
      path: skills/governed-prd-creation
      version: 1.1.1
      source_pr: 33
      final_pr_head: eab6db6554841182fe763fc7781a8e8db90feaa2
      merge_commit: f218d5ffaddcab12a736420166f3348b31183dac
    license: MIT
    artifact_status: package
    package_sha256: 7360064f2ebe4fc0bd18b0eeb33251114170dce32a0238578da1e388ea4c98a7
    public_pr: 2
    public_merge_commit: ee6c7a853b18e8f3928f1c5a299a0d9750fcfb2c
    verification: "PASS: Clean-room mounted installation from public merge ee6c7a853b18e8f3928f1c5a299a0d9750fcfb2c matched all 13 governed skill blobs and passed 10 behavioral contract checks; the installable skill.zip contains the same 13 files, extracted with exact source parity, passed skill-creator validation, and is integrity-bound by the manifest package_sha256."
    residuals: []
