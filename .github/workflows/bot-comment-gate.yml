name: Bot Comment Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  bot-comment-gate:
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    name: Bot Comment Closure Rate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: bot-comment-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Check automated review dispositions, thread resolution and exact head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          comments_file=$(mktemp)
          issue_comments_file=$(mktemp)
          reviews_file=$(mktemp)
          files_file=$(mktemp)
          threads_file=$(mktemp)
          trap 'rm -f "$comments_file" "$issue_comments_file" "$reviews_file" "$files_file" "$threads_file" "$threads_file.next"' EXIT

          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/comments" --slurp > "$comments_file"
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --slurp > "$issue_comments_file"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" --slurp > "$reviews_file"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --slurp > "$files_file"
          head_sha=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid)

          changed_count=$(jq '(add // []) | length' "$files_file")
          if [ "$changed_count" -eq 0 ]; then
            echo "Pull request has no changed files."
            exit 1
          fi

          bot_logins='["github-copilot[bot]","copilot-pull-request-reviewer","copilot-pull-request-reviewer[bot]","openai-codex[bot]","chatgpt-codex-connector[bot]","chatgpt-codex-connector"]'

          missing=$(jq --argjson bots "$bot_logins" '
            (add // []) as $all |
            [$all[] |
              select(.in_reply_to_id == null and (.user.login as $u | $bots | index($u))) |
              . as $root |
              select(([$all[] |
                select(.in_reply_to_id == $root.id) |
                select(
                  (.body | test("^/implemented(?:\\s|$)")) or
                  (.body | test("^/rejected:\\s+\\S")) or
                  (.body | test("^/deferred:\\s+.+\\(action-[a-z0-9-]+\\)"))
                )
              ] | length) == 0) |
              .id]
          ' "$comments_file")

          if [ "$(jq length <<<"$missing")" -ne 0 ]; then
            echo "Undispositioned or invalidly dispositioned bot review comments: $missing"
            exit 1
          fi

          owner=${REPO%%/*}
          name=${REPO#*/}

          fetch_threads() {
            printf '[]\n' > "$threads_file"
            cursor=""
            while :; do
              if [ -n "$cursor" ]; then
                response=$(gh api graphql \
                  -f query='query($owner:String!,$name:String!,$number:Int!,$cursor:String){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100,after:$cursor){nodes{isResolved comments(first:1){nodes{databaseId author{login}}}} pageInfo{hasNextPage endCursor}}}}}' \
                  -F owner="$owner" -F name="$name" -F number="$PR_NUMBER" -f cursor="$cursor")
              else
                response=$(gh api graphql \
                  -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:1){nodes{databaseId author{login}}}} pageInfo{hasNextPage endCursor}}}}}' \
                  -F owner="$owner" -F name="$name" -F number="$PR_NUMBER")
              fi

              nodes=$(jq '.data.repository.pullRequest.reviewThreads.nodes // []' <<<"$response")
              jq --argjson nodes "$nodes" '. + $nodes' "$threads_file" > "$threads_file.next"
              mv "$threads_file.next" "$threads_file"

              has_next=$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$response")
              if [ "$has_next" != "true" ]; then
                break
              fi
              cursor=$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor // empty' <<<"$response")
              if [ -z "$cursor" ]; then
                echo "Review-thread pagination reported another page without a cursor."
                exit 1
              fi
            done
          }

          unresolved_bot_threads() {
            jq --argjson bots "$bot_logins" '
              [.[] |
                select(.isResolved == false) |
                select(.comments.nodes[0].author.login as $u | $bots | index($u)) |
                .comments.nodes[0].databaseId]
            ' "$threads_file"
          }

          fetch_threads
          unresolved=$(unresolved_bot_threads)

          # GitHub Actions does not expose a workflow trigger for review-thread
          # resolution. Keep the comment-triggered run alive long enough for the
          # maintainer's immediate resolve operation to converge automatically.
          for attempt in $(seq 1 18); do
            if [ "$(jq length <<<"$unresolved")" -eq 0 ]; then
              break
            fi
            echo "Automated review threads are still unresolved; rechecking in 10 seconds: $unresolved"
            sleep 10
            fetch_threads
            unresolved=$(unresolved_bot_threads)
          done

          if [ "$(jq length <<<"$unresolved")" -ne 0 ]; then
            echo "Unresolved automated review threads after bounded convergence window: $unresolved"
            exit 1
          fi

          reviewed_head=$(jq --argjson bots "$bot_logins" --arg head "$head_sha" '
            [(add // [])[] |
              select(
                .commit_id == $head and
                .state != "DISMISSED" and
                (.user.login as $u | $bots | index($u))
              )] |
              length > 0
          ' "$reviews_file")

          if [ "$reviewed_head" != "true" ]; then
            while IFS= read -r reviewed_ref; do
              [ -n "$reviewed_ref" ] || continue
              resolved_sha=$(gh api "repos/$REPO/commits/$reviewed_ref" --jq .sha 2>/dev/null || true)
              if [ "$resolved_sha" = "$head_sha" ]; then
                reviewed_head=true
                break
              fi
            done < <(
              jq -r --argjson bots "$bot_logins" '
                (add // [])[] |
                select(.user.login as $u | $bots | index($u)) |
                (.body // "") |
                try (capture("Reviewed commit[^0-9a-fA-F]*(?<sha>[0-9a-fA-F]{7,40})"; "i").sha | ascii_downcase) catch empty
              ' "$issue_comments_file"
            )
          fi

          if [ "$reviewed_head" != "true" ]; then
            echo "No approved automated reviewer has reviewed the current PR head: $head_sha"
            exit 1
          fi

          echo "Bot Comment Gate PASS"
