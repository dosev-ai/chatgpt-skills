name: Public Skill Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Public Skill Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'jsonschema==4.25.1'
      - name: Validate public repository and skill projections
        run: python scripts/validate_public_skills.py
